# ============================================================
# Time-VLM 复现环境（conda environment.yml）
#
# 已在本机（RTX3050 Laptop 4GB, 驱动 526.56, CUDA 12.0）完整验证：
#   conda env create -f environment.yml
#   # 然后手动装 torch（见下，pip 的 index-url 无法在 yaml 内精确指定 CUDA 变体）
#
# ⚠️ torch 必须按机器单独安装（yaml 的 pip 段不含 torch/torchvision）：
#   RTX3050(本机, Ampere sm_86, 驱动<530):
#       pip install "torch==2.2.2+cu118" "torchvision==0.17.2+cu118" --index-url https://download.pytorch.org/whl/cu118
#       # 国内可用阿里云镜像：https://mirrors.aliyun.com/pytorch-wheels/cu118/
#   RTX5090(目标, Blackwell sm_120, 需 CUDA 12.8):
#       pip install "torch==2.7.1" "torchvision==0.22.1" --index-url https://download.pytorch.org/whl/cu128
#       # torch 2.2.2 无 sm_120 kernel，RTX5090 上必须升级
#
# ⚠️ 已知坑（安装顺序很重要）：
#   1) reformer-pytorch==1.4.4 有未固定版本的 torch 依赖，直接 pip install 会把 torch
#      升级到最新版（破坏 cu118 固定）。必须先装好 torch，再装其余依赖；
#      若 pip 仍误升级，用 `pip install --no-deps torch==2.2.2+cu118` 回退。
#   2) pytorch-wavelets==1.3.0 依赖 pkg_resources，而 setuptools>=81 已移除它，
#      必须 `pip install "setuptools<81"` 才能 import。
#   3) requirements.txt 缺失 pytorch-wavelets（代码 import 但未列出），此处已补上。
# ============================================================
name: timevlm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # ---- torch/torchvision 单独装（见上方注释，勿在 pip 段内写）----
      - einops==0.8.0
      - matplotlib==3.7.0
      - numpy==1.23.5
      - pandas==1.5.3
      - patool==1.12
      - reformer-pytorch==1.4.4
      - scikit-learn==1.2.2
      - scipy==1.10.1
      - sktime==0.16.1
      - sympy==1.11.1
      - tqdm==4.64.1
      - transformers==4.46.3
      - timm==1.0.15
      - umap-learn==0.5.7
      - seaborn==0.13.2
      - PyWavelets==1.4.1
      # ---- requirements.txt 未列出但代码需要（本报告发现）----
      - pytorch-wavelets==1.3.0
      # ---- 使 pytorch-wavelets 的 pkg_resources 可用 ----
      - "setuptools<81"
